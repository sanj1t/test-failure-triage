[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-failure-triage"
version = "0.1.0"
description = "A reproducible ML project for engineering test-failure triage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"